<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Bj Beyond Scanner</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <h1>Bj Beyond Scanner</h1>
        <p id="site">Website Analysis</p>
    </header>

    <div id="start">
        <button id="scan-btn">Analizza questa pagina</button>
        <p id="scans-left" class="muted"></p>
    </div>

    <div id="loading" hidden>Analisi in corso…</div>

    <div id="results" hidden>
        <div id="main-score">-</div>
        <p id="platform" class="muted"></p>

        <div class="category">
            <div class="category-label"><span>SEO</span><span id="seo-score">-</span></div>
            <div class="category-bar"><div id="seo-bar" class="category-bar-fill"></div></div>
        </div>
        <div class="category">
            <div class="category-label"><span>Conversion</span><span id="conversion-score">-</span></div>
            <div class="category-bar"><div id="conversion-bar" class="category-bar-fill"></div></div>
        </div>
        <div class="category">
            <div class="category-label"><span>Trust</span><span id="trust-score">-</span></div>
            <div class="category-bar"><div id="trust-bar" class="category-bar-fill"></div></div>
        </div>
        <div class="category">
            <div class="category-label"><span>Technical</span><span id="technical-score">-</span></div>
            <div class="category-bar"><div id="technical-bar" class="category-bar-fill"></div></div>
        </div>
        <div class="category">
            <div class="category-label"><span>UX</span><span id="ux-score">-</span></div>
            <div class="category-bar"><div id="ux-bar" class="category-bar-fill"></div></div>
        </div>

        <h3>Opportunità</h3>
        <div id="opportunities"></div>
        <button id="export-btn" class="secondary">Esporta report</button>
    </div>

    <div id="error"></div>

    <script src="analyzer.js"></script>
    <script src="popup.js"></script>
</body>
</html>
